[project]
name = "cairnward"
version = "0.0.1"
description = "Local privacy gateway for AI clients and agents, with literature-review workflows"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115",
    "httpx>=0.27",
    "mcp==2.3.0",
    "pydantic>=2.8",
    "pypdfium2>=4.30",
    "pyrage>=1.2",
    "pyyaml>=6",
    "sqlalchemy>=2.0",
    "sqlite-vec>=0.1.6",
    "uvicorn>=0.30",
]

[project.scripts]
cairnward = "cairnward.cli:main"
cw = "cairnward.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "ruff>=0.6",
    "mypy>=1.11",
    "pip-audit>=2.7",
    "pytest-asyncio>=0.24",
    "openai>=1.40",
    "types-pyyaml>=6.0.12.20261103",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cairnward"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PTH"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S310", "S603", "S607"]  # test passphrases are fine
"scripts/**" = ["S310"]  # urllib with user-supplied URLs is the point of the bench script
"spikes/**" = ["S310", "S603", "S607", "S311", "PTH123", "E501"]  # spike probes deliberately open URLs and sockets
# Starting configured tools (srt, node, npm, the agent the user asked for) is their purpose.
"src/cairnward/doctor.py" = ["S603", "S607"]
"src/cairnward/run/runner.py" = ["S603"]
"src/cairnward/sandbox/srt.py" = ["S603"]
"src/cairnward/run/snapshots.py" = ["S603"]
"src/cairnward/audit/anchor.py" = ["S603"]
"src/cairnward/artifacts.py" = ["S603"]
"src/cairnward/research/engines/*.py" = ["S603", "S301"]  # starts its own worker; loads its own index  # git with fixed arguments
"src/cairnward/research/check.py" = ["RUF001"]
"src/cairnward/research/cite.py" = ["RUF001"]  # typographic dashes are part of the styles  # it normalises typographic quotes and dashes on purpose  # git and ssh-keygen with fixed arguments
"evals/**" = ["S101", "S603", "S607"]  # evaluation scripts run agents and tests
# Vector table names are vec_<integer library id>; no user text reaches SQL strings.
"src/cairnward/research/library.py" = ["S608"]

[[tool.mypy.overrides]]
module = ["paperqa", "paperqa.*", "citeproc", "citeproc.*", "docling", "docling.*", "presidio_analyzer", "presidio_analyzer.*"]  # optional engines, separate environments
ignore_missing_imports = true

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["pyrage", "pyrage.*", "pypdfium2", "pypdfium2.*", "sqlite_vec"]  # no type stubs published
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["cairnward"]
branch = true
