[project]
name = "cairnward"
version = "0.1.0"
description = "Local privacy gateway for AI clients and agents"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115",
    "httpx>=0.27",
    "mcp==2.3.0",
    "pydantic>=2.8",
    "pyrage>=1.2",
    "cryptography>=44",
    "sqlalchemy>=2.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# SQLCipher "encrypt everything" mode (ADR-0019): its only wheel is Linux x86-64.
sqlcipher = ["sqlcipher3-binary>=0.6; sys_platform == 'linux' and platform_machine == 'x86_64'"]

[project.scripts]
cairnward = "cairnward.cli:main"
cw = "cairnward.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "ruff>=0.6",
    "mypy>=1.11",
    "pip-audit>=2.7",
    "pytest-asyncio>=0.24",
    "openai>=1.40",
    "sqlcipher3-binary>=0.6; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cairnward"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PTH"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S310", "S603", "S607"]  # test passphrases are fine
"scripts/**" = ["S310"]  # urllib with user-supplied URLs is the point of the bench script
"spikes/**" = ["S310", "S603", "S607", "S311", "PTH123", "E501"]  # spike probes deliberately open URLs and sockets
# Starting configured tools (srt, node, npm, the agent the user asked for) is their purpose.
"src/cairnward/doctor.py" = ["S603", "S607"]
"src/cairnward/run/runner.py" = ["S603"]
"src/cairnward/sandbox/srt.py" = ["S603"]
"src/cairnward/run/snapshots.py" = ["S603"]
"src/cairnward/audit/anchor.py" = ["S603"]
"src/cairnward/artifacts.py" = ["S603"]
"src/cairnward/redaction_engines/*.py" = ["S603"]  # starts its own worker
"evals/**" = ["S101", "S603", "S607"]  # evaluation scripts run agents and tests
# Vector table names are vec_<integer library id>; no user text reaches SQL strings.

[[tool.mypy.overrides]]
module = ["presidio_analyzer", "presidio_analyzer.*"]  # an optional engine, in its own environment
ignore_missing_imports = true

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["pyrage", "pyrage.*", "pypdfium2", "pypdfium2.*", "sqlite_vec"]  # no type stubs published
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["cairnward"]
branch = true
