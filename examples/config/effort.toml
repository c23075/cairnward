#:schema ../../schemas/effort.schema.json
# Built-in levels: low, medium, high. Levels here replace built-ins of the same name or add new ones.
schema_version = 1

[effort.deep-review]
model_role = "main"
thinking = true
thinking_budget_tokens = 8192
max_tool_steps = 40
subagents = { max = 6, max_parallel = 1, effort = "medium" }
context_tokens = 16384
temperature = 0.6
wall_clock_limit = "8h"          # e.g. an overnight literature review
skills = ["lit-review", "citation-check"]
order = 40
