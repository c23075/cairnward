#:schema ../../../schemas/environment.schema.json
# The file name is the environment's name: pick it in any client as cw/thesis-confidential:<effort>.
schema_version = 1
description = "Unpublished thesis material: strict, no conversation content kept"
workspace = ["~/research/thesis"]
effort_default = "high"
context_tokens = 8192
tools = ["rag", "pdf", "zotero"]
skills = ["lit-review", "citation-check", "references"]
citation_style = "apa"

[privacy]
preset = "strict"
vault = "digests"
