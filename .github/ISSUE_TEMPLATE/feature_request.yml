name: Feature request
description: Suggest a change or a new feature
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you're trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: How it could work. If it touches a privacy or security protection, say how it stays switchable.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
