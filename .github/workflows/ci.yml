name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"  # fail if uv.lock is out of date with pyproject.toml

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - name: Install restic (the backup tool under test)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q restic
      - run: uv sync
      # A floor against regressions, on Linux only (Windows skips more tests, ~71%).
      - run: uv run pytest --cov --cov-report=term-missing ${{ runner.os == 'Linux' && '--cov-fail-under=75' || '' }}
      - name: At least 80% in every package (NFR-MAINT-1)
        if: runner.os == 'Linux'
        run: uv run coverage json -o coverage.json && uv run python scripts/check_coverage.py coverage.json

  rust:
    # ADR-0020: the Rust egress data path, checked against the Python one it replaces
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain (pinned; rustup is on the runner image)
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component clippy,rustfmt
          rustup default 1.97.0
      - working-directory: rust
        run: cargo fmt --all --check
      - working-directory: rust
        run: cargo clippy --locked --all-targets -- -D warnings
      - working-directory: rust
        run: cargo test --locked
      - working-directory: rust
        run: cargo build --locked
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync
      - name: Rust and Python agree (differential tests, and every egress test on both paths)
        run: uv run pytest -q tests/test_egress_rust.py tests/test_egress.py tests/test_egress_decisions.py tests/test_egress_rust_runner.py

  test-debian:
    runs-on: ubuntu-24.04
    container: python:3.12-slim-bookworm  # Debian 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync
      - run: uv run pytest

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Check dependencies for known vulnerabilities
        run: |
          uv export --format requirements-txt --all-groups --no-emit-project -o requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt --disable-pip --require-hashes --strict
      # Runtime dependencies only. A new licence string fails here until someone reads it and
      # adds it. pyrage is left out because its metadata names no licence; its LICENSE file is MIT.
      - name: Check licences of runtime dependencies
        run: |
          uv sync --no-dev --frozen
          uvx pip-licenses@5.5.5 --python .venv/bin/python --ignore-packages pyrage --allow-only="Apache-2.0;Apache-2.0 OR BSD-3-Clause;BSD License;BSD-3-Clause;BSD-3-Clause, Apache-2.0, dependency licenses;MIT;MIT License;MIT License, Apache License, Version 2.0;MIT-0;Mozilla Public License 2.0 (MPL 2.0);PSF-2.0"

  dashboard-e2e:
    # T2.7: the dashboard in Chromium against a running `cairnward serve`.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install pinned Playwright and Chromium
        working-directory: tests/e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Dashboard end to end
        run: |
          uv sync
          uv run pytest -v tests/e2e

  isolation-spike:
    # T0.6: sandbox-runtime + bubblewrap isolation checks (docs/adr/0013).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install bubblewrap, socat and ripgrep (sandbox-runtime prerequisites)
        run: sudo apt-get update -q && sudo apt-get install -y -q bubblewrap socat ripgrep
      - name: Allow unprivileged user namespaces (Ubuntu 24.04 restricts them via AppArmor)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install pinned sandbox-runtime
        working-directory: spikes/t06-sandbox
        run: npm ci --no-audit --no-fund
      - name: Audit sandbox-runtime dependencies
        working-directory: spikes/t06-sandbox
        # Known, accepted: GHSA-mrhx-c7xc-m3w5 (zod), see docs/adr/0013. Any other high/critical fails.
        run: |
          npm audit --omit=dev --json > audit.json || true
          node -e '
            const a = require("./audit.json");
            const accepted = new Set(["GHSA-mrhx-c7xc-m3w5"]);
            const bad = [];
            for (const v of Object.values(a.vulnerabilities || {}))
              for (const via of v.via) if (typeof via === "object" && ["high","critical"].includes(via.severity)
                  && !accepted.has((via.url || "").split("/").pop())) bad.push(via.url);
            if (bad.length) { console.error("New advisories:", bad); process.exit(1); }
            console.log("npm audit: only accepted advisories");'
      - name: Isolation checks
        run: spikes/t06-sandbox/run_spike.sh
      - name: Chaining to the egress proxy
        run: spikes/t06-sandbox/run_chain.sh
      - name: Build the Rust egress data path (ADR-0020), so serve can run it too
        run: |
          rustup toolchain install 1.97.0 --profile minimal
          cargo +1.97.0 build --locked --manifest-path rust/Cargo.toml
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Isolated serve + cairnward run + plugins, end to end
        env:
          CAIRNWARD_SRT: node ${{ github.workspace }}/spikes/t06-sandbox/node_modules/@anthropic-ai/sandbox-runtime/dist/cli.js
        run: |
          uv sync
          uv run pytest -v tests/isolation
