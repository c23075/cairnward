[package]
name = "cairnward-audit"
version = "0.1.0"
description = "An independent verifier for Cairnward's audit log: record hashes, the hash chain and the Merkle tree (ADR-0020, stage 4)."
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "cairnward-audit-rs"
path = "src/main.rs"

[dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.11"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
missing_errors_doc = "allow"
must_use_candidate = "allow"
